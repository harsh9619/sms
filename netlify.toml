[build]
  command = "npm run build"
  publish = "dist"

# Proxy backend routes to the NestJS API (mirrors vercel.json rewrites)
[[redirects]]
  from = "/auth/*"
  to = "https://edorbit.netlify.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://edorbit.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://edorbit.netlify.app/uploads/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200